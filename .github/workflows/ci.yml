# Typecheck, unit tests and dependency audit on every push and pull request. The production build reads the
# reference data from Supabase while collecting page data, so it runs only where the repository has the
# Supabase secrets (Settings › Secrets and variables › Actions).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.SUPABASE_SECRET_KEY != ''
      - uses: actions/setup-node@v4
        if: env.SUPABASE_SECRET_KEY != ''
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: env.SUPABASE_SECRET_KEY != ''
      - run: npm run build
        if: env.SUPABASE_SECRET_KEY != ''
